<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body class="bg-black flex items-center justify-center h-screen">
    <div
      class="bg-gray-900 p-8 rounded-lg border border-gray-800 w-full max-w-sm shadow-xl"
    >
      <div class="text-center mb-6">
        <svg
          class="w-12 h-12 text-yellow-500 mx-auto mb-2"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
          ></path>
        </svg>
        <h2 class="text-2xl font-bold text-white">Acesso Restrito</h2>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-gray-400 text-sm mb-1">Email</label>
          <input
            type="email"
            id="email"
            class="w-full p-3 bg-gray-800 text-white rounded border border-gray-700 focus:border-yellow-500 focus:outline-none transition"
            placeholder="admin@barbearia.com"
          />
        </div>

        <div>
          <label class="block text-gray-400 text-sm mb-1">Senha</label>
          <input
            type="password"
            id="senha"
            class="w-full p-3 bg-gray-800 text-white rounded border border-gray-700 focus:border-yellow-500 focus:outline-none transition"
            placeholder="••••••••"
          />
        </div>

        <button
          onclick="fazerLogin()"
          class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-3 rounded transition duration-200 transform hover:scale-[1.02]"
        >
          Entrar
        </button>

        <p
          id="msgErro"
          class="text-red-500 text-sm text-center mt-4 hidden bg-red-900/30 p-2 rounded border border-red-800"
        ></p>
      </div>
    </div>

    <script>
      const SUPABASE_URL = "https://tnltiicshevuxkjsnkmm.supabase.co";
      const SUPABASE_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRubHRpaWNzaGV2dXhranNua21tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NDQwMzQsImV4cCI6MjA4NjQyMDAzNH0.7otLzZqWwzV1PUQCxrC9k-Y-KZ--QrQVVYllZKSFans";

      const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      async function fazerLogin() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("senha").value;
        const msgErro = document.getElementById("msgErro");
        const btn = document.querySelector("button");

        msgErro.classList.add("hidden");
        btn.innerHTML = "Verificando...";
        btn.disabled = true;
        btn.classList.add("opacity-50", "cursor-not-allowed");

        try {
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password,
          });

          if (error) {
            throw error;
          } else {
            window.location.href = "admin.html";
          }
        } catch (error) {
          console.error(error);
          msgErro.textContent = "Email ou senha incorretos.";
          msgErro.classList.remove("hidden");
          btn.innerHTML = "Entrar";
          btn.disabled = false;
          btn.classList.remove("opacity-50", "cursor-not-allowed");
        }
      }
    </script>
  </body>
</html>
