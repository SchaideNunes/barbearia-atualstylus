<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - AtualStylus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #111; color: white; font-family: sans-serif; }
    </style>
</head>
<body>
    <div class="max-w-4xl mx-auto p-4">
        <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
            <h1 class="text-2xl font-bold text-white">Painel Administrativo</h1>
            <button onclick="sair()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded transition font-semibold text-sm">
                Sair
            </button>
        </div>

        <div class="bg-gray-800 p-4 rounded-lg border border-gray-700 mb-6 shadow-md">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-gray-400 text-xs font-bold uppercase tracking-wider">Filtrar Agenda</h3>
                <span id="totalRegistros" class="text-xs text-yellow-500 font-mono">Total: 0</span>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <input type="text" id="buscaTexto" placeholder="🔍 Buscar Nome ou Telefone..." 
                        class="w-full bg-gray-900 text-white border border-gray-600 rounded p-2 text-sm focus:border-yellow-500 focus:outline-none transition"
                        oninput="aplicarFiltros()">
                </div>

                <div>
                    <input type="date" id="buscaData" 
                        class="w-full bg-gray-900 text-white border border-gray-600 rounded p-2 text-sm focus:border-yellow-500 focus:outline-none transition"
                        onchange="aplicarFiltros()">
                </div>

                <div>
            <select id="buscaBarbeiro" 
                class="w-full bg-gray-900 text-white border border-gray-600 rounded p-2 text-sm focus:border-yellow-500 focus:outline-none transition"
                 onchange="aplicarFiltros()">
                <option value="">✂️ Todos os Barbeiros</option>
        
                <option value="1">Geilson</option>
                <option value="2">Denilson</option>
         </select>
                </div>

                <div>
                    <button onclick="limparFiltros()" 
                        class="w-full bg-gray-700 hover:bg-gray-600 text-white border border-gray-500 rounded p-2 text-sm transition font-medium">
                        Limpar Filtros
                    </button>
                </div>
            </div>
        </div>

        <div id="listaAgendamentos" class="space-y-4">
            <div class="text-center py-10">
                <p class="text-gray-400 animate-pulse">Carregando dados seguros...</p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://tnltiicshevuxkjsnkmm.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRubHRpaWNzaGV2dXhranNua21tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NDQwMzQsImV4cCI6MjA4NjQyMDAzNH0.7otLzZqWwzV1PUQCxrC9k-Y-KZ--QrQVVYllZKSFans'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let cacheAgendamentos = [];

        async function iniciarAdmin() {
            const lista = document.getElementById('listaAgendamentos');

            try {
                const { data: { session }, error: authError } = await supabaseClient.auth.getSession();

                if (authError || !session) {
                    window.location.href = 'login.html'; 
                    return;
                }
                const { data: agendamentos, error: dbError } = await supabaseClient
                    .from('agendamentos')
                    .select('*')
                    .order('data_agendamento', { ascending: true }) 
                    .order('horario', { ascending: true });

                if (dbError) throw dbError;
                cacheAgendamentos = agendamentos;
                renderizarLista(cacheAgendamentos);

            } catch (err) {
                console.error('Erro:', err);
                lista.innerHTML = `
                    <div class="bg-red-900/50 p-4 rounded border border-red-500 text-white">
                        <strong class="block mb-2">Erro ao carregar dados:</strong>
                        ${err.message}
                    </div>
                `;
            }
        }
        function renderizarLista(listaDeDados) {
            const divLista = document.getElementById('listaAgendamentos');
            const contador = document.getElementById('totalRegistros');
            contador.innerText = `Total: ${listaDeDados ? listaDeDados.length : 0}`;

            if (!listaDeDados || listaDeDados.length === 0) {
                divLista.innerHTML = `
                    <div class="text-center py-10 bg-gray-900 rounded-lg border border-gray-700">
                        <svg class="w-12 h-12 text-gray-600 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                        </svg>
                        <p class="text-xl text-gray-300">Nenhum agendamento encontrado.</p>
                        <p class="text-sm text-gray-500 mt-1">Tente mudar os filtros ou aguarde novos clientes.</p>
                    </div>
                `;
                return;
            }

            divLista.innerHTML = listaDeDados.map(ag => {
                const dataBR = new Date(ag.data_agendamento + 'T00:00:00').toLocaleDateString('pt-BR');
                
                return `
                <div class="bg-gray-800 p-5 rounded-lg border border-gray-700 shadow-lg hover:border-yellow-500/50 transition-colors duration-200">
                    <div class="flex justify-between items-start mb-4 border-b border-gray-700 pb-3">
                        <div>
                            <h3 class="text-lg font-bold text-white flex items-center gap-2">
                                ${ag.nome}
                            </h3>
                            <p class="text-yellow-500 text-sm font-medium mt-1">${ag.servico}</p>
                        </div>
                        <span class="bg-green-900/30 text-green-400 text-xs px-2 py-1 rounded border border-green-800 font-bold uppercase tracking-wide">
                            ${ag.status || 'Confirmado'}
                        </span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-y-3 gap-x-4 text-sm text-gray-300 mb-5">
                        <div class="flex items-center gap-2">
                            <span class="text-gray-500">📅</span> ${dataBR}
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-gray-500">⏰</span> <span class="font-bold text-white">${ag.horario}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-gray-500">📱</span> ${ag.telefone}
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-gray-500">✂️</span> ${ag.barbeiro_nome || 'Barbeiro'}
                        </div>
                    </div>

                    <div class="flex justify-end pt-2">
                        <button onclick="deletarAgendamento(${ag.id})" class="text-red-400 hover:text-red-300 text-sm font-medium flex items-center gap-1 hover:underline transition">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            Cancelar Agendamento
                        </button>
                    </div>
                </div>
            `}).join('');
        }
        function aplicarFiltros() {
            const texto = document.getElementById('buscaTexto').value.toLowerCase();
            const data = document.getElementById('buscaData').value;
            const barbeiroId = document.getElementById('buscaBarbeiro').value;

            const filtrados = cacheAgendamentos.filter(item => {
                const matchTexto = item.nome.toLowerCase().includes(texto) || item.telefone.includes(texto);
                const matchData = data ? item.data_agendamento === data : true;
                const matchBarbeiro = barbeiroId ? item.barbeiro_id == barbeiroId : true;

                return matchTexto && matchData && matchBarbeiro;
            });

            renderizarLista(filtrados);
        }
        function limparFiltros() {
            document.getElementById('buscaTexto').value = '';
            document.getElementById('buscaData').value = '';
            document.getElementById('buscaBarbeiro').value = '';
            renderizarLista(cacheAgendamentos);
        }
        async function deletarAgendamento(id) {
            if(!confirm("Tem certeza que deseja cancelar este agendamento?")) return;

            try {
                const { error } = await supabaseClient
                    .from('agendamentos')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                alert('Agendamento removido!');
                iniciarAdmin();

            } catch (error) {
                alert('Erro ao deletar: ' + error.message);
            }
        }
        async function sair() {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }
        iniciarAdmin();
    </script>
</body>
</html>
