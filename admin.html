<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - AtualStylus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background-color: #111; color: white; font-family: sans-serif; }
    </style>
</head>
<body>
    <div class="max-w-4xl mx-auto p-4">
        <div class="flex justify-between items-center mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-2xl font-bold text-white">Painel Administrativo</h1>
            <button onclick="sair()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded">
                Sair
            </button>
        </div>

        <div id="listaAgendamentos" class="space-y-4">
            <p>Carregando dados seguros...</p>
        </div>
    </div>

    <script>

        const SUPABASE_URL = 'https://tnltiicshevuxkjsnkmm.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRubHRpaWNzaGV2dXhranNua21tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA4NDQwMzQsImV4cCI6MjA4NjQyMDAzNH0.7otLzZqWwzV1PUQCxrC9k-Y-KZ--QrQVVYllZKSFans';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function iniciarAdmin() {
            const lista = document.getElementById('listaAgendamentos');

            try {

                const { data: { session }, error: authError } = await supabase.auth.getSession();

                if (authError || !session) {

                    window.location.href = 'login.html';
                    return;
                }

                const { data: agendamentos, error: dbError } = await supabase
                    .from('agendamentos')
                    .select('*')
                    .order('data_agendamento', { ascending: true });

                if (dbError) {
                    console.error('Erro Supabase:', dbError);
                    lista.innerHTML = `
                        <div class="bg-red-900 text-white p-4 rounded border border-red-500">
                            <strong>Erro ao carregar dados:</strong><br>
                            ${dbError.message}<br>
                            <small>Verifique o Console (F12) para mais detalhes.</small>
                        </div>
                    `;
                    return;
                }

                if (!agendamentos || agendamentos.length === 0) {
                    lista.innerHTML = `
                        <div class="text-center py-10 text-gray-400">
                            <p class="text-xl">📭 Nenhum agendamento encontrado.</p>
                            <p class="text-sm mt-2">O banco de dados está conectado, mas vazio.</p>
                        </div>
                    `;
                    return;
                }

                lista.innerHTML = agendamentos.map(ag => {

                    const dataBR = new Date(ag.data_agendamento + 'T00:00:00').toLocaleDateString('pt-BR');
                    
                    return `
                    <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 shadow-lg mb-4 hover:border-yellow-500 transition-colors">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-xl font-bold text-yellow-500">${ag.nome}</h3>
                                <p class="text-gray-400 text-sm">${ag.servico}</p>
                            </div>
                            <span class="bg-green-900 text-green-300 text-xs px-2 py-1 rounded-full uppercase font-bold tracking-wide">
                                ${ag.status || 'Confirmado'}
                            </span>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4 text-sm text-gray-300 mb-4">
                            <div class="flex items-center gap-2">
                                <span>📅 ${dataBR}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span>⏰ ${ag.horario}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span>📱 ${ag.telefone}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span>✂️ ${ag.barbeiro_nome || 'Barbeiro'}</span>
                            </div>
                        </div>

                        <button onclick="deletarAgendamento(${ag.id})" class="w-full bg-red-600/20 hover:bg-red-600 text-red-500 hover:text-white border border-red-600 py-2 rounded transition duration-200 flex items-center justify-center gap-2">
                            🗑️ Cancelar Agendamento
                        </button>
                    </div>
                `}).join('');

            } catch (err) {
                console.error('Erro Crítico:', err);
                lista.innerHTML = `<p class="text-red-500">Erro crítico no Javascript: ${err.message}</p>`;
            }
        }

        async function deletarAgendamento(id) {
            if(!confirm("Tem certeza que deseja excluir este agendamento?")) return;

            const { error } = await supabase
                .from('agendamentos')
                .delete()
                .eq('id', id);

            if (error) {
                alert('Erro ao deletar: ' + error.message);
            } else {
                alert('Agendamento removido!');
                iniciarAdmin();
            }
        }

        async function sair() {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        }

        iniciarAdmin();
    </script>
</body>
</html>
